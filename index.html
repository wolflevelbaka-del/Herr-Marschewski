<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Herr Marschewski</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b9e8; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e2327; color: #fff; font-size: 20px; z-index: 5; transition: opacity .4s; }
  #hint { position: fixed; left: 12px; bottom: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; pointer-events: none; }
  #stick { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4); display: none; }
  #knob { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.7); }
  @media (pointer: coarse) { #stick { display: block; } #hint { display: none; } }
</style>
</head>
<body>
<div id="loading">Lade Herr Marschewski …</div>
<div id="hint">WASD / Pfeiltasten: laufen · Shift: rennen<br>Maus ziehen: Kamera drehen · Mausrad: Zoom</div>
<div id="stick"><div id="knob"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------- Einstellungen ---------- */
const MODEL_URL    = './models/character.glb';
const CHAR_HEIGHT  = 1.8;
const FACING_FIX   = 0;          // Falls er seitwärts/rückwärts läuft: Math.PI, Math.PI/2 oder -Math.PI/2
const WALK_SPEED   = 3.5;
const RUN_SPEED    = 7;
const BASE_SIZE    = 80;

/* ---------- Szene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9e8);
scene.fog = new THREE.Fog(0x87b9e8, 40, 110);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(20, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 100 });
scene.add(sun, sun.target);

/* ---------- Baseplate ---------- */
const c = document.createElement('canvas'); c.width = c.height = 256;
const g = c.getContext('2d');
g.fillStyle = '#6b6f76'; g.fillRect(0, 0, 256, 256);
g.strokeStyle = '#5a5e65'; g.lineWidth = 4; g.strokeRect(0, 0, 256, 256);
const tex = new THREE.CanvasTexture(c);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(BASE_SIZE / 4, BASE_SIZE / 4);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;

const baseplate = new THREE.Mesh(
  new THREE.BoxGeometry(BASE_SIZE, 1, BASE_SIZE),
  new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 })
);
baseplate.position.y = -0.5;
baseplate.receiveShadow = true;
scene.add(baseplate);

/* ---------- Charakter ---------- */
const player = new THREE.Group();
const bodyPivot = new THREE.Group();
player.add(bodyPivot);
scene.add(player);

let mixer = null, walkAction = null;

new GLTFLoader().load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const s = CHAR_HEIGHT / size.y;
  model.scale.setScalar(s);
  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);
  model.rotation.y = FACING_FIX;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  bodyPivot.add(model);

  // Falls später eine GLB MIT Walk-Animation benutzt wird, wird sie automatisch genutzt
  if (gltf.animations.length) {
    mixer = new THREE.AnimationMixer(model);
    const clip = gltf.animations.find(a => /walk|lauf/i.test(a.name)) || gltf.animations[0];
    walkAction = mixer.clipAction(clip);
    walkAction.play(); walkAction.paused = true;
  }
  const l = document.getElementById('loading');
  l.style.opacity = 0; setTimeout(() => l.remove(), 450);
}, undefined, (e) => {
  document.getElementById('loading').textContent = 'Fehler beim Laden des Modells: ' + (e.message || e);
});

/* ---------- Eingabe ---------- */
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup',   e => keys[e.code] = false);

let camYaw = 0, camPitch = 0.35, camDist = 6;
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.clientX < 180 && e.clientY > innerHeight - 180 && e.pointerType === 'touch') return;
  dragging = true; lx = e.clientX; ly = e.clientY;
});
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  camYaw   -= (e.clientX - lx) * 0.005;
  camPitch += (e.clientY - ly) * 0.005;
  camPitch = THREE.MathUtils.clamp(camPitch, -0.1, 1.3);
  lx = e.clientX; ly = e.clientY;
});
addEventListener('wheel', e => { camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.005, 2.5, 14); });

// Virtueller Joystick (Handy)
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
const joy = { x: 0, y: 0, id: null };
stick.addEventListener('pointerdown', e => { joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); moveJoy(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === joy.id) moveJoy(e); });
const endJoy = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.left = knob.style.top = '40px'; } };
stick.addEventListener('pointerup', endJoy); stick.addEventListener('pointercancel', endJoy);
function moveJoy(e) {
  const r = stick.getBoundingClientRect();
  let dx = (e.clientX - r.left - 60) / 50, dy = (e.clientY - r.top - 60) / 50;
  const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
  joy.x = dx; joy.y = dy;
  knob.style.left = 40 + dx * 40 + 'px'; knob.style.top = 40 + dy * 40 + 'px';
}

/* ---------- Game Loop ---------- */
const clock = new THREE.Clock();
let walkPhase = 0, speedSmooth = 0;
const half = BASE_SIZE / 2 - 1;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  let iz = (keys.KeyS || keys.ArrowDown  ? 1 : 0) - (keys.KeyW || keys.ArrowUp   ? 1 : 0) + joy.y;
  const mag = Math.min(1, Math.hypot(ix, iz));
  const running = keys.ShiftLeft || keys.ShiftRight || mag > 0.95 && joy.id !== null;
  let moving = mag > 0.05;

  if (moving) {
    const dir = new THREE.Vector3(ix, 0, iz).normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
    const speed = (running ? RUN_SPEED : WALK_SPEED) * mag;
    player.position.addScaledVector(dir, speed * dt);
    player.position.x = THREE.MathUtils.clamp(player.position.x, -half, half);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -half, half);

    const target = Math.atan2(dir.x, dir.z);
    let diff = target - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 12);
    speedSmooth += (speed - speedSmooth) * Math.min(1, dt * 10);
  } else {
    speedSmooth += (0 - speedSmooth) * Math.min(1, dt * 10);
  }

  const k = speedSmooth / WALK_SPEED;
  if (mixer && walkAction) {
    walkAction.paused = false;
    walkAction.timeScale = k;
    mixer.update(dt);
  } else {
    // Modell hat kein Skelett -> Lauf-Animation per Code
    walkPhase += dt * (6 + speedSmooth * 1.2) * (k > 0.02 ? 1 : 0);
    const a = Math.min(k, 1.6);
    bodyPivot.position.y = Math.abs(Math.sin(walkPhase)) * 0.09 * a;
    bodyPivot.rotation.z = Math.sin(walkPhase) * 0.10 * a;
    bodyPivot.rotation.x = 0.12 * Math.min(k, 2);
    bodyPivot.rotation.y = Math.sin(walkPhase) * 0.06 * a;
  }

  const focus = player.position.clone().add(new THREE.Vector3(0, CHAR_HEIGHT * 0.8, 0));
  camera.position.set(
    focus.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
    focus.y + Math.sin(camPitch) * camDist,
    focus.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist
  );
  camera.position.y = Math.max(camera.position.y, 0.4);
  camera.lookAt(focus);

  sun.position.set(player.position.x + 20, 30, player.position.z + 10);
  sun.target.position.copy(player.position);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
